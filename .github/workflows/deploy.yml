# Deploy the apex redirect to GitHub Pages.
#
# opsb.co.uk is retired as a site host: chat.opsb.co.uk (Cloudflare Pages) is
# canonical. This workflow publishes a tiny redirect site to GitHub Pages so the
# apex bounces over to chat (canonical + JS path-preserving + meta-refresh
# fallback). It replaces the old Elm-CV build, which kept overriding the
# redirect on every push to main.
name: Deploy apex redirect to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect site
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>opsb.co.uk</title>
          <link rel="canonical" href="https://chat.opsb.co.uk/">
          <script>location.replace("https://chat.opsb.co.uk" + location.pathname + location.search + location.hash);</script>
          <meta http-equiv="refresh" content="0; url=https://chat.opsb.co.uk/">
          </head>
          <body>Redirecting to <a href="https://chat.opsb.co.uk/">chat.opsb.co.uk</a>…</body>
          </html>
          HTML
          # 404 handles deep paths (/node-lead etc.); the JS preserves the path.
          cp _site/index.html _site/404.html
          # Keep the custom domain attached to this Pages site.
          printf 'opsb.co.uk\n' > _site/CNAME
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
