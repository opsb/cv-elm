# Deploy the apex redirect to GitHub Pages.
#
# opsb.co.uk is retired as a site host: chat.opsb.co.uk (Cloudflare Pages) is
# canonical. This workflow publishes a tiny redirect site to GitHub Pages so the
# apex bounces over to chat (canonical + JS path-preserving + meta-refresh
# fallback). It replaces the old Elm-CV build, which kept overriding the
# redirect on every push to main.
#
# GitHub Pages is static and can't emit a real 301 for arbitrary paths: unknown
# paths fall through to 404.html (which still redirects in-browser via JS, but
# returns a 404 status to crawlers/link-unfurlers). So we additionally emit a
# per-route stub (/<route>/index.html) for every real CV route, which returns
# 200 with a correct per-path canonical. Keep ROUTES in step with the route list
# in the opsb.co.uk repo (web/scripts/generate-pdf.js + src/Directory/Data.elm);
# any route missing here still works in-browser via the 404.html fallback.
name: Deploy apex redirect to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect site
        run: |
          set -euo pipefail

          # Real CV routes on chat.opsb.co.uk that should redirect at the apex.
          ROUTES="elixir experimental node cto team-lead em node-staff node-tech node-lead cto-ai elixir-staff elixir-lead elixir-em directory"

          # Emit a redirect page whose canonical + meta-refresh point at $1.
          # The JS preserves the full path/query/hash regardless of which file
          # served it, so the per-route meta target is only the no-JS fallback.
          emit() {
            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html lang="en">' \
              '<head>' \
              '<meta charset="utf-8">' \
              '<title>opsb.co.uk</title>' \
              "<link rel=\"canonical\" href=\"$1\">" \
              '<script>location.replace("https://chat.opsb.co.uk" + location.pathname + location.search + location.hash);</script>' \
              "<meta http-equiv=\"refresh\" content=\"0; url=$1\">" \
              '</head>' \
              "<body>Redirecting to <a href=\"$1\">chat.opsb.co.uk</a>…</body>" \
              '</html>'
          }

          mkdir -p _site
          # Apex root, plus the catch-all 404 for any path without a stub below.
          emit "https://chat.opsb.co.uk/" > _site/index.html
          cp _site/index.html _site/404.html
          # Keep the custom domain attached to this Pages site.
          printf 'opsb.co.uk\n' > _site/CNAME

          # Per-route stubs: known deep paths return 200, not 404.
          for r in $ROUTES; do
            mkdir -p "_site/$r"
            emit "https://chat.opsb.co.uk/$r" > "_site/$r/index.html"
          done
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
